services:
  dev:
    image: ${WRUH_IMAGE:-ghcr.io/heartpunk/wruh-dev:latest}
    platform: linux/amd64
    init: true
    user: "${WRUH_UID:-1000}:${WRUH_GID:-1000}"
    working_dir: /workspace
    volumes:
      - .:/workspace
    security_opt:
      - seccomp=unconfined
      - apparmor=${WRUH_APPARMOR_PROFILE:-unconfined}
      - systempaths=unconfined
    cap_drop:
      - ALL
    stdin_open: true
    tty: true
