name: Live binary census

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to census
        required: true
        type: string
      target:
        description: Full census target
        required: true
        type: choice
        options:
          - lua
          - quickjs
          - cpython
          - apache
          - node
          - bun

permissions:
  contents: read
  pull-requests: read

jobs:
  live-census:
    name: Live single-target census (optional)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Validate pull request number
        env:
          PR_NUMBER: ${{ inputs.pull_request }}
        run: '[[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/pull/${{ inputs.pull_request }}/merge
          fetch-depth: 2
          persist-credentials: false
      - name: Record pull request provenance
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          python3 - <<'PY'
          import json, os, subprocess
          with open(os.environ['RUNNER_TEMP'] + '/pr.json', encoding='utf-8') as stream:
              pr = json.load(stream)
          merge_head = subprocess.check_output(['git', 'rev-parse', 'HEAD^2'], text=True).strip()
          if merge_head != pr['head']['sha']:
              raise RuntimeError('PR head changed during checkout; retry the workflow')
          values = {
              'WRUH_CI_PULL_REQUEST_NUMBER': str(pr['number']),
              'WRUH_CI_PULL_REQUEST_ID': str(pr['id']),
              'WRUH_CI_PULL_REQUEST_HEAD_REPOSITORY': pr['head']['repo']['full_name'],
              'WRUH_CI_PULL_REQUEST_HEAD_SHA': pr['head']['sha'],
              'WRUH_CI_CHECKED_OUT_SHA': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
          }
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              for key, value in values.items():
                  if '\n' in value or '\r' in value:
                      raise ValueError('unexpected newline in PR metadata')
                  env.write(f'{key}={value}\n')
          PY
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: wruh
          extraPullNames: ifrl,ayxg
          skipPush: true
      - name: Run one full census with live failure diagnostics
        env:
          WRUH_CI_SERVER_URL: ${{ github.server_url }}
          WRUH_CI_REPOSITORY: ${{ github.repository }}
          WRUH_CI_RUN_ID: ${{ github.run_id }}
          WRUH_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          WRUH_CI_WORKFLOW: ${{ github.workflow }}
          WRUH_CI_JOB: ${{ github.job }}
          LIVE_TARGET: ${{ inputs.target }}
        run: bash tools/run_census_ci.sh "$LIVE_TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: live-binary-census-reports
          path: ${{ runner.temp }}/wruh-census
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn
