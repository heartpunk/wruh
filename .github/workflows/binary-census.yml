name: Binary function census

on:
  pull_request:

permissions:
  contents: read

# Reuse the public, immutable runtime image already built by the successful
# census image job. The Dockerfile, flake.nix, flake.lock, and nix/cache.conf
# inputs are unchanged, so this avoids a second Docker build for this run.
env:
  BUILDBUDDY_RBE_CONTAINER_IMAGE: ghcr.io/heartpunk/wruh-dev@sha256:5b8f558060bfa1859776413c1ef090b9133d7616d2a2746f1fe67dd8bc2e08f4

concurrency:
  group: binary-census-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lua:
    name: Lua function census
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: wruh
          extraPullNames: ifrl,ayxg
      - name: Prepare report directory
        run: mkdir -p "$RUNNER_TEMP/wruh-census-lua"
      - name: Build symbol-preserving Lua target
        run: |
          target="$(nix build --no-link --no-write-lock-file --print-out-paths .#packages.x86_64-linux.censusLua)"
          {
            printf 'WRUH_CENSUS_BINARY=%s\n' "$(readlink -f "$target/binary")"
            printf 'WRUH_CENSUS_VERSION=%s\n' "$(cat "$target/version")"
            printf 'WRUH_CENSUS_PACKAGE=%s\n' "$(cat "$target/package")"
            printf 'WRUH_CENSUS_CONFIGURATION=%s\n' "$(cat "$target/build-configuration")"
            printf 'WRUH_CENSUS_DERIVATION=%s\n' "$(cat "$target/package-derivation")"
            printf 'WRUH_CENSUS_NIXPKGS_REVISION=%s\n' "$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)"
            printf 'WRUH_CENSUS_AYXG_REVISION=%s\n' "$(jq -r '.nodes.ayxg.locked.rev' flake.lock)"
          } >> "$GITHUB_ENV"
      - name: Run generic binary census
        env:
          BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
          BUILDBUDDY_REQUIRE_REMOTE: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          WRUH_CENSUS_TARGET_ID: lua
          WRUH_CENSUS_TARGET_KIND: interpreter
          WRUH_CENSUS_TARGET_IMPLEMENTATION: Lua
          WRUH_CI_SERVER_URL: ${{ github.server_url }}
          WRUH_CI_REPOSITORY: ${{ github.repository }}
          WRUH_CI_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          WRUH_CI_PULL_REQUEST_ID: ${{ github.event.pull_request.id }}
          WRUH_CI_PULL_REQUEST_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          WRUH_CI_PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WRUH_CI_RUN_ID: ${{ github.run_id }}
          WRUH_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          WRUH_CI_CHECKED_OUT_SHA: ${{ github.sha }}
          WRUH_CI_WORKFLOW: ${{ github.workflow }}
          WRUH_CI_JOB: ${{ github.job }}
        run: |
          bash tools/run_census_ci.sh \
            "--ci-server-url=$WRUH_CI_SERVER_URL" \
            "--ci-repository=$WRUH_CI_REPOSITORY" \
            "--ci-pull-request-number=$WRUH_CI_PULL_REQUEST_NUMBER" \
            "--ci-pull-request-id=$WRUH_CI_PULL_REQUEST_ID" \
            "--ci-pull-request-head-repository=$WRUH_CI_PULL_REQUEST_HEAD_REPOSITORY" \
            "--ci-pull-request-head-sha=$WRUH_CI_PULL_REQUEST_HEAD_SHA" \
            "--ci-run-id=$WRUH_CI_RUN_ID" \
            "--ci-run-attempt=$WRUH_CI_RUN_ATTEMPT" \
            "--ci-checked-out-sha=$WRUH_CI_CHECKED_OUT_SHA" \
            "--ci-workflow=$WRUH_CI_WORKFLOW" \
            "--ci-job=$WRUH_CI_JOB"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: binary-census-lua
          path: ${{ runner.temp }}/wruh-census-lua
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn

