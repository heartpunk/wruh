name: Binary function census

on:
  pull_request:

permissions:
  contents: read

# One GitHub coordinator builds all six Nix inputs and submits their census
# test targets in one Bazel invocation. Superseded PR runs still cancel.
concurrency:
  group: binary-census-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  buildbuddy_rbe_image:
    name: Prepare BuildBuddy remote execution image
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and publish the pinned Nix runtime image
        id: publish
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/heartpunk/wruh-dev:rbe-${GITHUB_SHA}"
          docker build --network=host --target buildbuddy-rbe --tag "$image" .
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker push "$image"
          image_digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          printf 'image=%s\n' "$image_digest" >> "$GITHUB_OUTPUT"

  census:
    name: Six binary function censuses
    needs: buildbuddy_rbe_image
    if: ${{ !cancelled() && (needs.buildbuddy_rbe_image.result == 'success' || needs.buildbuddy_rbe_image.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: wruh
          extraPullNames: ifrl,ayxg
          skipPush: true
      - name: Build Nix inputs and run all six censuses through Bazel
        env:
          BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
          BUILDBUDDY_RBE_CONTAINER_IMAGE: ${{ needs.buildbuddy_rbe_image.outputs.image }}
          BUILDBUDDY_REQUIRE_REMOTE: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_PUSH_ENABLED: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          WRUH_CI_SERVER_URL: ${{ github.server_url }}
          WRUH_CI_REPOSITORY: ${{ github.repository }}
          WRUH_CI_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          WRUH_CI_PULL_REQUEST_ID: ${{ github.event.pull_request.id }}
          WRUH_CI_PULL_REQUEST_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          WRUH_CI_PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WRUH_CI_RUN_ID: ${{ github.run_id }}
          WRUH_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          WRUH_CI_CHECKED_OUT_SHA: ${{ github.sha }}
          WRUH_CI_WORKFLOW: ${{ github.workflow }}
          WRUH_CI_JOB: ${{ github.job }}
        run: bash tools/run_census_ci.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: binary-census-reports
          path: ${{ runner.temp }}/wruh-census
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn
