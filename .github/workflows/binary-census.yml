name: Binary function census

on:
  pull_request:

permissions:
  contents: read

# One GitHub coordinator builds census Nix inputs and submits their tests in
# one Bazel invocation. The failed-Lua fix branch selects four exact symbols;
# other pull requests retain all six binary censuses. Superseded runs cancel.
concurrency:
  group: binary-census-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUILDBUDDY_RBE_CONTAINER_IMAGE: ghcr.io/heartpunk/wruh-dev@sha256:5b8f558060bfa1859776413c1ef090b9133d7616d2a2746f1fe67dd8bc2e08f4

jobs:
  census:
    name: ${{ github.head_ref == 'codex/lua-failed-functions' && 'Four failed Lua function extractions' || 'Six binary function censuses' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: wruh
          extraPullNames: ifrl,ayxg
          skipPush: true
      - name: Build Nix inputs and run the selected census through Bazel
        env:
          BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
          BUILDBUDDY_REQUIRE_REMOTE: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_PUSH_ENABLED: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          WRUH_CI_SERVER_URL: ${{ github.server_url }}
          WRUH_CI_REPOSITORY: ${{ github.repository }}
          WRUH_CI_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          WRUH_CI_PULL_REQUEST_ID: ${{ github.event.pull_request.id }}
          WRUH_CI_PULL_REQUEST_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          WRUH_CI_PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WRUH_CI_RUN_ID: ${{ github.run_id }}
          WRUH_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          WRUH_CI_CHECKED_OUT_SHA: ${{ github.sha }}
          WRUH_CI_WORKFLOW: ${{ github.workflow }}
          WRUH_CI_JOB: ${{ github.job }}
          WRUH_CENSUS_ONLY_FAILED_LUA_FUNCTIONS: ${{ github.head_ref == 'codex/lua-failed-functions' }}
        run: bash tools/run_census_ci.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: binary-census-reports
          path: ${{ runner.temp }}/wruh-census
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn
