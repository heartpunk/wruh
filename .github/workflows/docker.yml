name: Docker development environment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image and validate bootstrap after startup
        run: bash tools/ci_docker.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wruh-dev-linux-amd64
          path: ${{ runner.temp }}/wruh-dev.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: docker
    if: github.repository == 'heartpunk/wruh' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wruh-dev-linux-amd64
          path: ${{ runner.temp }}/image
      - name: Publish the tested image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          docker load --input "$RUNNER_TEMP/image/wruh-dev.tar.gz"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker tag ghcr.io/heartpunk/wruh-dev:latest "ghcr.io/heartpunk/wruh-dev:$GITHUB_SHA"
          docker push "ghcr.io/heartpunk/wruh-dev:$GITHUB_SHA"
          docker push ghcr.io/heartpunk/wruh-dev:latest
