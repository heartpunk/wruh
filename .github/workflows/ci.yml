name: CI

on:
  pull_request:
  push:
    branches: [main, codex/iform-pbt-minimal-draft]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: wruh
          extraPullNames: ifrl,ayxg
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Require Cachix write token for repository builds
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [[ -z "$CACHIX_AUTH_TOKEN" ]]; then
            echo '::error::CACHIX_AUTH_TOKEN is required to publish the WRUH cache.'
            exit 1
          fi
      - name: Use HTTPS for public GitHub flake inputs
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:
      - name: Build the pinned development shell
        run: nix develop --no-write-lock-file --command true
      - name: Check Python source syntax
        run: python3 -m compileall -q extractor tools

      - name: Run Python tests in the pinned development shell
        run: |
          # shellcheck disable=SC2016
          nix develop --no-write-lock-file --command bash -c 'export PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}"; exec python3 -m pytest tests -v'

  native-pbt:
    name: Native instruction PBT smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: wruh
          extraPullNames: ifrl,ayxg
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Use HTTPS for public GitHub flake inputs
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:
      - name: Allow bubblewrap user namespaces on the hosted runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the native PBT executables
        run: nix develop --no-write-lock-file --command lake build wruh-iform-pbt wruh-fresh
      - name: Run a seeded native PBT campaign
        run: |
          mkdir -p "$RUNNER_TEMP/wruh-iform-pbt"
          set -o pipefail
          nix develop --no-write-lock-file --command bash -c \
            'export WRUH_PBT_TIMEOUT_SECONDS=900; exec experiments/iform_pbt/run.sh data/iform-catalogue/catalogue.jsonl "$RUNNER_TEMP/wruh-iform-pbt" 1 2 1' \
            2>&1 | tee "$RUNNER_TEMP/wruh-iform-pbt.log"
      - name: Upload native PBT run log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wruh-iform-pbt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wruh-iform-pbt.log
          if-no-files-found: ignore
          retention-days: 30
