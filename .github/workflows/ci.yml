name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check AYXG dependency locks agree
        run: |
          python3 - <<'PY'
          import json

          with open('flake.lock') as f:
              flake_rev = json.load(f)['nodes']['ayxg']['locked']['rev']
          with open('lake-manifest.json') as f:
              lake_rev = next(p['rev'] for p in json.load(f)['packages'] if p['name'] == 'ayxg')
          if flake_rev != lake_rev:
              raise SystemExit('AYXG revisions differ between flake.lock and lake-manifest.json')
          PY
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: wruh
          extraPullNames: ifrl,ayxg
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Require Cachix write token for repository builds
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [[ -z "$CACHIX_AUTH_TOKEN" ]]; then
            echo '::error::CACHIX_AUTH_TOKEN is required to publish the WRUH cache.'
            exit 1
          fi
      - name: Use HTTPS for public GitHub flake inputs
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:
      - name: Build the pinned development shell
        run: nix develop --no-write-lock-file --command true
      - name: Check Python source syntax
        run: python3 -m compileall -q extractor tools

      - name: Build pinned Apache binary for SIGTRAP regression
        run: |
          set -euo pipefail
          apache_outputs="$(nix build --no-link --no-write-lock-file --print-out-paths .#packages.x86_64-linux.apacheHttpdPinned.out)"
          if [[ -z "$apache_outputs" || "$apache_outputs" == *$'\n'* ]]; then
            printf 'Expected exactly one Apache out path, got:\n%s\n' "$apache_outputs" >&2
            exit 1
          fi
          apache_binary="$apache_outputs/bin/httpd"
          if [[ ! -x "$apache_binary" ]]; then
            printf 'Pinned Apache executable is missing: %s\n' "$apache_binary" >&2
            exit 1
          fi
          printf 'WRUH_APACHE_HTTPD=%s\n' "$apache_binary" >> "$GITHUB_ENV"

      - name: Run Python tests in the pinned development shell
        run: |
          # shellcheck disable=SC2016
          nix develop --no-write-lock-file --command bash -c 'export PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}"; exec python3 -m pytest tests -v'
