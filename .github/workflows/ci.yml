name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: wruh
          extraPullNames: ifrl,ayxg
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Require Cachix write token for repository builds
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [[ -z "$CACHIX_AUTH_TOKEN" ]]; then
            echo '::error::CACHIX_AUTH_TOKEN is required to publish the WRUH cache.'
            exit 1
          fi
      - name: Use HTTPS for public GitHub flake inputs
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:
      - name: Build the pinned development shell
        run: nix develop --no-write-lock-file --command true
      - name: Check Python source syntax
        run: python3 -m compileall -q extractor

      - name: Run Python unit and CLI metadata integration tests in the pinned development shell
        run: |
          # shellcheck disable=SC2016
          nix develop --no-write-lock-file --command bash -c 'export PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}"; exec python3 -m unittest discover -s tests -p "test_*.py" -v'
